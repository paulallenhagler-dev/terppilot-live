name: Import Head Change Pharmacopeia

on:
  push:
    paths:
      - ".github/workflows/headchange-import.yml"
      - "scripts/import_headchange.py"
      - "scripts/embed_headchange.py"
      - "scripts/enrich_headchange_coas.py"
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * 1"

permissions:
  contents: write

concurrency:
  group: headchange-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf
      - name: Download and validate entire Pharmacopeia
        run: python scripts/import_headchange.py
      - name: Parse and reconcile original lab PDF panels
        run: python scripts/enrich_headchange_coas.py
      - name: Update the deployed single-file catalog
        run: python scripts/embed_headchange.py
      - name: Publish only validated catalog changes
        run: |
          git config user.name "terppilot-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html headchange.js data/headchange-catalog.json data/headchange-import-report.json data/headchange-coa-cache.json data/headchange-enrichment-report.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Head Change catalog from Pharmacopeia"
            git push
          fi
